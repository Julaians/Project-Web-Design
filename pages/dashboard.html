<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTS - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:rounded focus:bg-white focus:px-3 focus:py-2 focus:text-slate-900">Skip to main content</a>

    <header class="sticky top-0 z-40 bg-slate-900 text-white shadow">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between px-4 py-3">
            <a href="dashboard.html" class="text-lg font-bold tracking-tight">Online Task Scheduler</a>
            <button type="button" id="nav-toggle" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"
                class="rounded-md border border-slate-600 p-2 hover:bg-slate-800 md:hidden">
                <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <nav id="navbarNav" aria-label="Main" class="hidden w-full md:flex md:flex-1 md:items-center md:justify-between md:pl-6">
                <ul class="mt-3 flex flex-col gap-1 md:mt-0 md:flex-row">
                    <li><a href="dashboard.html" aria-current="page" class="block rounded-md px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white aria-[current=page]:bg-slate-800 aria-[current=page]:text-white">Dashboard</a></li>
                    <li><a href="tasks.html" class="block rounded-md px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white aria-[current=page]:bg-slate-800 aria-[current=page]:text-white">Tasks</a></li>
                    <li><a href="board.html" class="block rounded-md px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white aria-[current=page]:bg-slate-800 aria-[current=page]:text-white">Schedule Board</a></li>
                </ul>
                <div class="mt-3 flex items-center gap-3 border-t border-slate-700 pt-3 md:mt-0 md:border-0 md:pt-0">
                    <span id="nav-username" class="text-sm font-semibold text-slate-200"></span>
                    <button type="button" onclick="logout()" class="rounded-lg border border-slate-500 px-3 py-1.5 text-sm font-bold hover:bg-slate-800">Logout</button>
                </div>
            </nav>
        </div>
    </header>

    <main id="main-content" class="mx-auto max-w-6xl px-4 py-6 pb-12">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
            <h1 class="text-2xl font-bold">Dashboard</h1>
            <button type="button" data-open-task-modal
                class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-bold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Add Task</button>
        </div>

        <!-- Stats -->
        <section aria-labelledby="stats-heading" class="mb-6">
            <h2 id="stats-heading" class="sr-only">Task statistics</h2>
            <dl class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
                <div class="rounded-xl border border-slate-200 bg-white p-5 text-center shadow-sm">
                    <dt class="text-xs font-bold uppercase tracking-wide text-slate-500">Total Tasks</dt>
                    <dd id="stat-total" class="mt-2 text-4xl font-bold text-slate-900">0</dd>
                </div>
                <div class="rounded-xl border border-slate-200 bg-white p-5 text-center shadow-sm">
                    <dt class="text-xs font-bold uppercase tracking-wide text-slate-500">Pending</dt>
                    <dd id="stat-pending" class="mt-2 text-4xl font-bold text-amber-600">0</dd>
                </div>
                <div class="rounded-xl border border-slate-200 bg-white p-5 text-center shadow-sm">
                    <dt class="text-xs font-bold uppercase tracking-wide text-slate-500">Completed</dt>
                    <dd id="stat-completed" class="mt-2 text-4xl font-bold text-emerald-600">0</dd>
                </div>
                <div class="rounded-xl border border-slate-200 bg-white p-5 text-center shadow-sm">
                    <dt class="text-xs font-bold uppercase tracking-wide text-slate-500">Completed Late</dt>
                    <dd id="stat-late" class="mt-2 text-4xl font-bold text-red-600">0</dd>
                </div>
            </dl>
        </section>

        <!-- Charts -->
        <div class="grid gap-4 lg:grid-cols-2">
            <section aria-labelledby="status-chart-heading" class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
                <h2 id="status-chart-heading" class="mb-4 text-lg font-bold">Task Status</h2>
                <div class="mx-auto w-full max-w-xs">
                    <canvas id="statusChart" role="img" aria-label="Doughnut chart of tasks completed on time, completed late, and pending">Task status chart. The numbers are shown in the statistics above.</canvas>
                </div>
            </section>
            <section aria-labelledby="category-chart-heading" class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
                <h2 id="category-chart-heading" class="mb-4 text-lg font-bold">Tasks by Category</h2>
                <div class="w-full">
                    <canvas id="categoryChart" role="img" aria-label="Bar chart of the number of tasks in the Study, Work and Personal categories">Tasks by category chart.</canvas>
                </div>
            </section>
        </div>
    </main>

    <!-- Modal container for task dialogs -->
    <div id="modal-container"></div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- App scripts (ORDER MATTERS: main.js must be last) -->
    <script src="../js/auth.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/due-status.js"></script>
    <script src="../js/task-validation.js"></script>
    <script src="../js/task-modal.js"></script>
    <script src="../js/task-crud.js"></script>
    <script src="../js/render-tasks.js"></script>
    <script src="../js/render-board.js"></script>
    <script src="../js/render-dashboard.js"></script>
    <script src="../js/export-csv.js"></script>
    <script src="../js/templates.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
