<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTS - Task List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:rounded focus:bg-white focus:px-3 focus:py-2 focus:text-slate-900">Skip to main content</a>

    <header class="sticky top-0 z-40 bg-slate-900 text-white shadow">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between px-4 py-3">
            <a href="dashboard.html" class="text-lg font-bold tracking-tight">Online Task Scheduler</a>
            <button type="button" id="nav-toggle" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"
                class="rounded-md border border-slate-600 p-2 hover:bg-slate-800 md:hidden">
                <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <nav id="navbarNav" aria-label="Main" class="hidden w-full md:flex md:flex-1 md:items-center md:justify-between md:pl-6">
                <ul class="mt-3 flex flex-col gap-1 md:mt-0 md:flex-row">
                    <li><a href="dashboard.html" class="block rounded-md px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white aria-[current=page]:bg-slate-800 aria-[current=page]:text-white">Dashboard</a></li>
                    <li><a href="tasks.html" aria-current="page" class="block rounded-md px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white aria-[current=page]:bg-slate-800 aria-[current=page]:text-white">Tasks</a></li>
                    <li><a href="board.html" class="block rounded-md px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white aria-[current=page]:bg-slate-800 aria-[current=page]:text-white">Schedule Board</a></li>
                </ul>
                <div class="mt-3 flex items-center gap-3 border-t border-slate-700 pt-3 md:mt-0 md:border-0 md:pt-0">
                    <span id="nav-username" class="text-sm font-semibold text-slate-200"></span>
                    <button type="button" onclick="logout()" class="rounded-lg border border-slate-500 px-3 py-1.5 text-sm font-bold hover:bg-slate-800">Logout</button>
                </div>
            </nav>
        </div>
    </header>

    <main id="main-content" class="mx-auto max-w-6xl px-4 py-6 pb-12">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
            <h1 class="text-2xl font-bold">Task List</h1>
            <div class="flex flex-wrap gap-2">
                <button type="button" onclick="fetchTemplates()"
                    class="inline-flex items-center rounded-lg border border-sky-300 bg-white px-4 py-2 text-sm font-bold text-sky-700 hover:bg-sky-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600 disabled:cursor-not-allowed disabled:opacity-60">Load Templates</button>
                <button type="button" onclick="exportToCSV()"
                    class="rounded-lg border border-emerald-300 bg-white px-4 py-2 text-sm font-bold text-emerald-700 hover:bg-emerald-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600">Export CSV</button>
                <button type="button" data-open-task-modal
                    class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-bold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Add Task</button>
            </div>
        </div>

        <!-- Search + filters (listeners are attached in js/layout.js) -->
        <div role="search" aria-label="Search and filter tasks" class="mb-6 grid gap-2 sm:grid-cols-2 lg:grid-cols-5">
            <div>
                <label for="search-task" class="sr-only">Search tasks</label>
                <input type="search" id="search-task" placeholder="Search tasks..."
                    class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
            </div>
            <div>
                <label for="filter-due" class="sr-only">Filter by due date</label>
                <select id="filter-due" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
                    <option value="all">All Due Dates</option>
                    <option value="past">Past Due</option>
                    <option value="today">Today</option>
                    <option value="tomorrow">Tomorrow</option>
                    <option value="upcoming">Upcoming</option>
                </select>
            </div>
            <div>
                <label for="filter-category" class="sr-only">Filter by category</label>
                <select id="filter-category" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
                    <option value="all">All Categories</option>
                    <option value="Study">Study</option>
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                </select>
            </div>
            <div>
                <label for="filter-priority" class="sr-only">Filter by priority</label>
                <select id="filter-priority" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
                    <option value="all">All Priorities</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
            <div>
                <label for="filter-status" class="sr-only">Filter by status</label>
                <select id="filter-status" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
                    <option value="all">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
        </div>

        <ul id="tasks-container" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></ul>
    </main>

    <!-- Modal container for task dialogs -->
    <div id="modal-container"></div>

    <!-- App scripts (ORDER MATTERS: main.js must be last) -->
    <script src="../js/auth.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/due-status.js"></script>
    <script src="../js/task-validation.js"></script>
    <script src="../js/task-modal.js"></script>
    <script src="../js/task-crud.js"></script>
    <script src="../js/render-tasks.js"></script>
    <script src="../js/render-board.js"></script>
    <script src="../js/render-dashboard.js"></script>
    <script src="../js/export-csv.js"></script>
    <script src="../js/templates.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
