<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PlanIt</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-8 text-slate-900">
    <main class="w-full max-w-sm">
        <p class="mb-6 text-center text-4xl font-bold text-indigo-600">PlanIt.</p>

        <section aria-labelledby="auth-heading" class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <h1 id="auth-heading" class="mb-4 text-xl font-semibold">Welcome Back</h1>
            <p id="auth-error" class="mb-3 text-sm font-semibold text-red-600" role="alert"></p>

            <form id="login-form" class="space-y-4">
                <div>
                    <label for="username" class="mb-1 block text-sm font-semibold text-slate-700">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required
                        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
                </div>
                <div>
                    <label for="password" class="mb-1 block text-sm font-semibold text-slate-700">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required
                        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
                </div>
                <button type="submit"
                    class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-bold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Log In</button>
            </form>

            <p class="mt-4 text-center text-sm text-slate-600">
                Don't have an account? <a href="register.html" class="font-semibold text-indigo-600 hover:underline">Sign Up</a>
            </p>
        </section>
    </main>

    <script src="../js/auth.js"></script>
</body>
</html>
